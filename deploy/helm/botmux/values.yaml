replicaCount: 1
image:
  repository: aliyun-sin-hub.byted.org/agentserver/botmux
  tag: 3.23.0-byted.7
  pullPolicy: IfNotPresent
imagePullSecrets: []
botIndex: "0"
setup:
  # Required: setup add cannot safely create a bot without an owner.
  allowedUsers: []
  cli: codex
  workingDir: /home/node
  openPlatformAuto: false
service:
  type: ClusterIP
  dashboardPort: 7891
  terminalPort: 8800

ingress:
  enabled: false
  host: ""
  gatewayName: istio-gateway
  gatewayNamespace: istio-ingress
  gatewaySectionName: https-byted-bps
persistence:
  enabled: true
  storageClass: longhorn
  size: 30Gi
credentials:
  existingSecret: ""
  larkCli:
    appId: ""
    appSecret: ""
    brand: feishu
  bytedcli:
    serviceAccount:
      accessKeyId: ""
      secretAccessKey: ""
  bkectl:
    serviceAccount:
      accessKeyId: ""
      secretAccessKey: ""
  codex:
    apiKey: ""
serviceAccount:
  create: true
  name: ""
  automount: true
resources: {}

codex:
  model: gpt-6-astra
  modelProvider: llm
  modelReasoningEffort: xhigh
  modelContextWindow: 1050000
  modelAutoCompactTokenLimit: 900000
  sandboxMode: danger-full-access
  approvalPolicy: never
  checkForUpdateOnStartup: false
  provider:
    id: llm
    name: LLM
    baseUrl: ""
    envKey: OPENAI_API_KEY
    wireApi: responses
  tui:
    statusLine:
      - model
      - context-remaining
      - git-branch

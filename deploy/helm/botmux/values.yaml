replicaCount: 1
image:
  repository: aliyun-sin-hub.byted.org/agentserver/botmux
  tag: 3.30.0-byted.2
  pullPolicy: IfNotPresent
imagePullSecrets: []
botIndex: "0"
setup:
  # Required: setup add cannot safely create a bot without an owner.
  allowedUsers: []
  cli: codex
  workingDir: /home/node
  openPlatformAuto: false
service:
  type: ClusterIP
  dashboardPort: 7891
  terminalPort: 8800

# Public URL used in Feishu Web terminal buttons. When empty, an enabled
# HTTPS ingress derives https://<ingress.host>; set this explicitly when the
# external URL is provided by another reverse proxy or uses a non-HTTPS scheme.
web:
  publicUrl: ""

dsh:
  web:
    enabled: false
    port: 3080

postgres:
  enabled: true
  image: registry-sg.byted.cs.ac.cn/dockerhub/library/postgres:16-alpine
  database: dsh
  username: dsh
  port: 5432
  storageClass: longhorn
  storage: 10Gi

ingress:
  enabled: false
  host: ""
  gatewayName: istio-gateway
  gatewayNamespace: istio-ingress
  gatewaySectionName: https-byted-bps
persistence:
  enabled: true
  storageClass: longhorn
  size: 30Gi
credentials:
  existingSecret: ""
  larkCli:
    appId: ""
    appSecret: ""
    brand: feishu
  bytedcli:
    serviceAccount:
      accessKeyId: ""
      secretAccessKey: ""
  bkectl:
    serviceAccount:
      accessKeyId: ""
      secretAccessKey: ""
  codex:
    apiKey: ""
serviceAccount:
  create: true
  name: ""
  automount: true
resources: {}

codex:
  model: gpt-6-astra
  modelProvider: llm
  modelReasoningEffort: xhigh
  modelContextWindow: 1050000
  modelAutoCompactTokenLimit: 900000
  sandboxMode: danger-full-access
  approvalPolicy: never
  checkForUpdateOnStartup: false
  provider:
    id: llm
    name: LLM
    baseUrl: ""
    envKey: OPENAI_API_KEY
    wireApi: responses
  tui:
    statusLine:
      - model
      - context-remaining
      - git-branch

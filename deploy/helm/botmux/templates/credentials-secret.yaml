{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "botmux.credentialsSecretName" . }}
  labels:
    {{- include "botmux.labels" . | nindent 4 }}
type: Opaque
stringData:
  LARK_CLI_APP_ID: {{ .Values.credentials.larkCli.appId | quote }}
  LARK_CLI_APP_SECRET: {{ .Values.credentials.larkCli.appSecret | quote }}
  LARK_CLI_BRAND: {{ .Values.credentials.larkCli.brand | quote }}
  BYTEDCLI_ACCESS_KEY_ID: {{ .Values.credentials.bytedcli.serviceAccount.accessKeyId | quote }}
  BYTEDCLI_SECRET_ACCESS_KEY: {{ .Values.credentials.bytedcli.serviceAccount.secretAccessKey | quote }}
  BKECTL_ACCESS_KEY_ID: {{ .Values.credentials.bkectl.serviceAccount.accessKeyId | quote }}
  BKECTL_SECRET_ACCESS_KEY: {{ .Values.credentials.bkectl.serviceAccount.secretAccessKey | quote }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "botmux.fullname" . }}-codex-config
  labels:
    {{- include "botmux.labels" . | nindent 4 }}
data:
  config.toml: |
    model = {{ .Values.codex.model | quote }}
    model_provider = {{ .Values.codex.modelProvider | quote }}
    model_reasoning_effort = {{ .Values.codex.modelReasoningEffort | quote }}
    model_context_window = {{ printf "%.0f" .Values.codex.modelContextWindow }}
    model_auto_compact_token_limit = {{ printf "%.0f" .Values.codex.modelAutoCompactTokenLimit }}
    sandbox_mode = {{ .Values.codex.sandboxMode | quote }}
    approval_policy = {{ .Values.codex.approvalPolicy | quote }}
    check_for_update_on_startup = {{ .Values.codex.checkForUpdateOnStartup }}

    [model_providers.{{ .Values.codex.provider.id }}]
    name = {{ .Values.codex.provider.name | quote }}
    base_url = {{ .Values.codex.provider.baseUrl | quote }}
    env_key = {{ .Values.codex.provider.envKey | quote }}
    wire_api = {{ .Values.codex.provider.wireApi | quote }}

    [tui]
    status_line = {{ toJson .Values.codex.tui.statusLine }}

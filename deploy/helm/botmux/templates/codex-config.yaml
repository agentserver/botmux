apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "botmux.fullname" . }}-codex-config
  labels:
    {{- include "botmux.labels" . | nindent 4 }}
data:
  config.toml: |
    model = {{ .Values.codex.model | quote }}
    model_provider = {{ .Values.codex.provider.id | quote }}
    approval_policy = {{ .Values.codex.approvalPolicy | quote }}
    sandbox_mode = {{ .Values.codex.sandboxMode | quote }}

    [model_providers.{{ .Values.codex.provider.id }}]
    name = {{ .Values.codex.provider.name | quote }}
    base_url = {{ .Values.codex.provider.baseUrl | quote }}
    env_key = {{ .Values.codex.provider.envKey | quote }}
    wire_api = {{ .Values.codex.provider.wireApi | quote }}
    requires_openai_auth = {{ .Values.codex.provider.requiresOpenaiAuth }}

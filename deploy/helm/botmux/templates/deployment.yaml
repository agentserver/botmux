apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "botmux.fullname" . }}
  labels:
    {{- include "botmux.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "botmux.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "botmux.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "botmux.labels" . | nindent 8 }}
    spec:
      shareProcessNamespace: true
      serviceAccountName: {{ include "botmux.serviceAccountName" . }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      initContainers:
        - name: fix-home-perms
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - >-
              mkdir -p /home/node/.botmux;
              chown 1000:1000 /home/node/.botmux;
              chmod 700 /home/node/.botmux;
              find /home/node/.botmux -maxdepth 1 -type f -exec chown 1000:1000 {} + -exec chmod 600 {} +;
              if [ ! -e /home/node/.zshrc ]; then printf '%s\n' '# botmux container shell defaults' > /home/node/.zshrc; fi;
              chown 1000:1000 /home/node/.zshrc;
              chmod 600 /home/node/.zshrc;
              if [ -f /home/node/.bashrc ]; then sed -i '/^# botmux kerberos init$/,/^fi$/d' /home/node/.bashrc; chown 1000:1000 /home/node/.bashrc; chmod 600 /home/node/.bashrc; fi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: home
              mountPath: /home/node
        - name: configure-botmux
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /home/node/.codex
              if [ ! -e /home/node/.codex/config.toml ]; then
                cp /config/config.toml /home/node/.codex/config.toml
                chmod 600 /home/node/.codex/config.toml
              fi
              marker=/home/node/.botmux-initialized
              if [ -f "$marker" ]; then exit 0; fi
              botmux setup add --app-id "$LARK_CLI_APP_ID" --app-secret "$LARK_CLI_APP_SECRET" \
                --allowed-users "$BOTMUX_ALLOWED_USERS" --cli "$BOTMUX_SETUP_CLI" \
                --working-dir "$BOTMUX_SETUP_WORKING_DIR" {{ if .Values.setup.openPlatformAuto }}--open-platform-auto{{ else }}--no-open-platform-auto{{ end }} --json
              touch "$marker"
          env:
            - name: BOTMUX_ALLOWED_USERS
              value: {{ required "values.setup.allowedUsers must contain at least one owner" (join "," .Values.setup.allowedUsers) | quote }}
            - name: BOTMUX_SETUP_CLI
              value: {{ .Values.setup.cli | quote }}
            - name: BOTMUX_SETUP_WORKING_DIR
              value: {{ .Values.setup.workingDir | quote }}
          envFrom:
            - secretRef:
                name: {{ include "botmux.credentialsSecretName" . }}
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: codex-config
              mountPath: /config
        - name: configure-lark-cli
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              marker=/home/node/.lark-cli-initialized
              if [ -f "$marker" ]; then exit 0; fi
              if [ -n "${LARK_CLI_APP_ID}" ] && [ -n "${LARK_CLI_APP_SECRET}" ]; then
                printf '%s' "${LARK_CLI_APP_SECRET}" | lark-cli config init --app-id "${LARK_CLI_APP_ID}" --app-secret-stdin --brand "${LARK_CLI_BRAND}"
                touch "$marker"
              fi
          envFrom:
            - secretRef:
                name: {{ include "botmux.credentialsSecretName" . }}
          volumeMounts:
            - name: home
              mountPath: /home/node
      containers:
        - name: daemon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/botmux", "__daemon"]
          env:
            - name: HOME
              value: /home/node
            - name: SHELL
              value: /bin/bash
            - name: KRB5_CONFIG
              value: /etc/krb5.conf
            - name: BOTS_CONFIG
              value: /home/node/.botmux/bots.json
            - name: WORKING_DIR
              value: /home/node
            - name: SESSION_DATA_DIR
              value: /home/node/.botmux/data
            - name: BOTMUX_BOT_INDEX
              value: {{ .Values.botIndex | quote }}
            {{- if .Values.web.publicUrl }}
            - name: BOTMUX_PUBLIC_URL
              value: {{ .Values.web.publicUrl | trimSuffix "/" | quote }}
            {{- else if and .Values.ingress.enabled .Values.ingress.host }}
            - name: BOTMUX_PUBLIC_URL
              value: {{ printf "https://%s" .Values.ingress.host | quote }}
            {{- end }}
            - name: BKECTL_AUTH_MODE
              value: app_only
            - name: BYTECLOUD_AUTH_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "botmux.credentialsSecretName" . }}
                  key: BKECTL_ACCESS_KEY_ID
            - name: BYTECLOUD_AUTH_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "botmux.credentialsSecretName" . }}
                  key: BKECTL_SECRET_ACCESS_KEY
          envFrom:
            - secretRef:
                name: {{ include "botmux.credentialsSecretName" . }}
          ports:
            - name: terminal
              containerPort: 8800
          readinessProbe:
            tcpSocket:
              port: terminal
            initialDelaySeconds: 15
          livenessProbe:
            tcpSocket:
              port: terminal
            initialDelaySeconds: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: kerberos-config
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
            - name: kerberos-config
              mountPath: /etc/ssh/ssh_config.d/99-botmux-gssapi.conf
              subPath: ssh.conf
              readOnly: true
            - name: home
              mountPath: /etc/krb5.keytab
              subPath: .krb5/service.keytab
              readOnly: true
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/botmux", "__dashboard"]
          env:
            - name: HOME
              value: /home/node
            - name: WORKING_DIR
              value: /home/node
            - name: SESSION_DATA_DIR
              value: /home/node/.botmux/data
          ports:
            - name: dashboard
              containerPort: 7891
          readinessProbe:
            tcpSocket:
              port: dashboard
            initialDelaySeconds: 15
          livenessProbe:
            tcpSocket:
              port: dashboard
            initialDelaySeconds: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /home/node
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "botmux.fullname" . }}-home
        - name: codex-config
          configMap:
            name: {{ include "botmux.fullname" . }}-codex-config
        - name: kerberos-config
          configMap:
            name: {{ include "botmux.fullname" . }}-kerberos

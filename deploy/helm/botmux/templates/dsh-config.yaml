{{- if .Values.dsh.web.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "botmux.fullname" . }}-dsh-config
  labels:
    {{- include "botmux.labels" . | nindent 4 }}
data:
  settings.yaml: |
    agent-default-model:
      provider: openai
      model: {{ .Values.codex.model | quote }}
  cordis.patch.yml: |
    - id: llm-pi-ai
      config:
        providers:
          openai:
            apiKeyEnv: OPENAI_API_KEY
            api: openai-responses
            baseURL: {{ .Values.codex.provider.baseUrl | quote }}
            models:
              - id: {{ .Values.codex.model | quote }}
    - id: agent-default-model
      config:
        provider: openai
        model: {{ .Values.codex.model | quote }}
    - id: session-persistence-jsonl
      disabled: true
    - insert:
        - id: session-persistence-pg
          name: '@agentserver/dsh-session-persistence-pg'
          config:
            connectionString: !!js process.env.DSH_PG_URL
            schema: dsh
    - id: authentication
      name: '@agentserver/dsh-authentication'
      config:
        defaultProvider: !!js "process.env.DSH_OIDC_ISSUER === undefined ? 'token' : 'oidc'"
    - id: authentication-token
      name: '@agentserver/dsh-authentication-token'
    - id: authentication-oidc
      name: '@agentserver/dsh-authentication-oidc'
      disabled: !!js "process.env.DSH_OIDC_ISSUER === undefined"
      config:
        issuer: !!js "process.env.DSH_OIDC_ISSUER"
        clientId: !!js "process.env.DSH_OIDC_CLIENT_ID"
        clientSecretRef: !!js "process.env.DSH_OIDC_CLIENT_SECRET_REF"
        redirectUri: !!js "process.env.DSH_OIDC_REDIRECT_URI"
  agent-default.patch.yml: |
    - id: agent-default-model
      config:
        provider: openai
        model: {{ .Values.codex.model | quote }}
  dsh-persistence.patch.yml: |
    - id: session-persistence-jsonl
      disabled: true
    - insert:
        - id: session-persistence-pg
          name: '@agentserver/dsh-session-persistence-pg'
          config:
            connectionString: !!js process.env.DSH_PG_URL
            schema: dsh
  dsh-authentication.patch.yml: |
    - id: authentication
      name: '@agentserver/dsh-authentication'
      config:
        defaultProvider: !!js "process.env.DSH_OIDC_ISSUER === undefined ? 'token' : 'oidc'"
    - id: authentication-token
      name: '@agentserver/dsh-authentication-token'
    - id: authentication-oidc
      name: '@agentserver/dsh-authentication-oidc'
      disabled: !!js "process.env.DSH_OIDC_ISSUER === undefined"
      config:
        issuer: !!js "process.env.DSH_OIDC_ISSUER"
        clientId: !!js "process.env.DSH_OIDC_CLIENT_ID"
        clientSecretRef: !!js "process.env.DSH_OIDC_CLIENT_SECRET_REF"
        redirectUri: !!js "process.env.DSH_OIDC_REDIRECT_URI"
{{- end }}

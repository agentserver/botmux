{{- if .Values.dsh.web.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "botmux.fullname" . }}-dsh-config
  labels:
    {{- include "botmux.labels" . | nindent 4 }}
data:
  settings.yaml: |
    agent-default-model:
      provider: openai
      model: {{ .Values.codex.model | quote }}
  cordis.patch.yml: |
    - id: llm-pi-ai
      config:
        providers:
          openai:
            apiKeyEnv: OPENAI_API_KEY
            api: openai-responses
            baseURL: {{ .Values.codex.provider.baseUrl | quote }}
            models:
              - id: {{ .Values.codex.model | quote }}
    - id: agent-default-model
      config:
        provider: openai
        model: {{ .Values.codex.model | quote }}
  agent-default.patch.yml: |
    - id: agent-default-model
      config:
        provider: openai
        model: {{ .Values.codex.model | quote }}
  botmux-disable-web-fetch.patch.yml: |
    - id: web-fetch-http
      disabled: true
{{- end }}

name: Docker

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      botmux_version:
        description: 要安装的 npm botmux 版本（与镜像 tag 分开指定）
        required: true
        default: latest
        type: string
      tag:
        description: 自定义镜像 tag（留空则用 commit SHA）
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 暴露刚推送镜像的 manifest digest，供下游 bkectl 镜像按不可变引用消费
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU (multi-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/botmux
          # latest=auto: 只在当前 tag 是所有 tag 里最高的稳定 semver 时打 :latest。
          # canary/beta/rc 等 prerelease 不参与 latest 竞争。
          flavor: |
            latest=auto
          tags: |
            # master 分支 → :master
            type=ref,event=branch
            # v1.2.3 → :1.2.3, :1.2, :1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # workflow_dispatch 自定义 tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            # 兜底：commit SHA → :sha-<short-sha>
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BOTMUX_VERSION=${{ inputs.botmux_version || 'latest' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── byted 内网工具变体：继承本次 botmux base，追加 bkectl + bytedcli + lark-cli ──
  # 跑在 k8s-sg 自建 runner 上——它能访问 bkectl 安装脚本、BVC 发布包、内网 npm，
  # 以及 ghcr.io（拉 base 镜像）
  # 与内网镜像仓（推产物，registry 地址由 vars.ICM_REGISTRY 提供，避免把内网 host
  # 写进受 audit:domains 扫描的 .github/）。GitHub 托管 runner 连不上内网，故不可用。
  build-and-push-byted:
    needs: build-and-push
    runs-on: k8s-sg
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 拉 base 镜像用（base 由上一个 job 推到 ghcr）
      - name: Login to GitHub Container Registry (pull base)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 推产物用（内网镜像仓；host 由仓库变量提供，凭据走 secrets）
      - name: Login to internal image registry (push byted image)
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ICM_REGISTRY }}
          username: ${{ secrets.ICM_USERNAME }}
          password: ${{ secrets.ICM_PASSWORD }}

      - name: Generate Docker metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 内网 registry host 来自 vars.ICM_REGISTRY，仓库路径 agentserver/botmux
          images: ${{ vars.ICM_REGISTRY }}/agentserver/botmux
          # 与 base 镜像同一套 tag 规则（master / semver / sha），latest=auto
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,prefix=sha-

      - name: Build and push byted image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.byted
          # BVC 当前发布包仅支持 amd64，与 k8s-sg runner 一致。
          platforms: linux/amd64
          push: true
          # 以上一个 job 推送镜像的 manifest digest 作为 base——不可变、跟本次构建一一对应
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/botmux@${{ needs.build-and-push.outputs.digest }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

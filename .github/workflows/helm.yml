name: Helm

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'deploy/helm/botmux/**'
      - '.github/workflows/helm.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart
        run: helm package deploy/helm/botmux --destination "$RUNNER_TEMP"
      - name: Publish chart to GHCR OCI
        run: helm push "$RUNNER_TEMP"/botmux-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
